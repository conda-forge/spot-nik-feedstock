schema_version: 1

context:
  python_min: "3.11"
  version: "1.5.2"

package:
  name: spot-nik
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spot-nik/spot_nik-${{ version }}.tar.gz
  sha256: 637a2cd694a330d2e6e2776255721323a69e11236e5c5db0e66bf3783ca25392

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=7
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - astropy-base >=7.2.0
    - jplephem >=2.21
    - skyfield >=1.53
    - python-dateutil >=2.8.2
    - matplotlib >=3.8  # Don't use matplotlib-base.  QT is required.
    - ginga >=7.1.0

tests:
  - python:
      imports:
        - spot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Site Planning and Observation Tool
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://github.com/naojsoft/spot

extra:
  recipe-maintainers:
    - aneugart
    - ejeschke
